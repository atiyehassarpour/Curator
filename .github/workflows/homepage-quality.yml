name: Homepage quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "design/**"]

permissions:
  contents: read

jobs:
  homepage-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js && node --check tests/homepage.test.js
      - name: Run homepage regression tests
        run: node --test tests/homepage.test.js
